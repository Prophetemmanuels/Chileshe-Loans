<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting - Chileshe Innovations Loans</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,#072C21,#0B4F3C);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  .coin{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#F6D77E,#E3B23C 45%,#B88A20);display:grid;place-items:center;font-family:Georgia,serif;font-size:2rem;font-weight:800;color:#083A2C;margin:0 auto 18px}
  a{color:#E3B23C;font-weight:700}
  p{color:rgba(255,255,255,.75);max-width:44ch}
</style>
</head>
<body>
  <main>
    <div class="coin">K</div>
    <h1>Chileshe Innovations Money Lenders</h1>
    <p>Taking you to the app... If nothing happens, <a href="./index.html">tap here</a>.</p>
  </main>
  <script>
    // Send the visitor to the app, keeping the folder the page was served from
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = parts.length ? "/" + parts[0] + "/" : "/";
      location.replace(base + "index.html");
    })();
  </script>
</body>
</html>
